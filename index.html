<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HL&L Store — Detalles que marcan</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f5f5;color:#222}
header{background:#111;color:#fff;padding:24px 16px;text-align:center}header h1{margin:0;font-size:30px}header p{margin:7px 0 0;color:#ddd;font-size:17px}
.wrap{max-width:1100px;margin:auto;padding:18px}.intro{text-align:center;margin-bottom:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(245px,1fr));gap:18px}
.card{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 2px 10px #0001}.card img{width:100%;height:240px;object-fit:cover;background:#eee}.body{padding:15px}
.body h3{margin:0 0 8px;font-size:19px}.price{font-size:22px;font-weight:bold;margin:8px 0}.desc{color:#555;font-size:14px;line-height:1.45}.meta{color:#777;font-size:13px;margin-top:8px}.wa{display:block;background:#25D366;color:#fff;text-decoration:none;text-align:center;padding:12px;border-radius:9px;margin-top:14px;font-weight:bold}
.status{text-align:center;padding:20px;color:#666}.error{color:#b00020;background:#fff0f0;border-radius:10px;padding:15px}
footer{text-align:center;background:#111;color:#fff;padding:22px;margin-top:25px}
</style>
</head>
<body>
<header><h1>HL&L Store</h1><p>Detalles que marcan</p></header>
<main class="wrap">
<div class="intro"><h2>Productos personalizados</h2><p>Grabados a láser en termos, Hoppies, vasos y billeteras.</p></div>
<section id="productos" class="grid"><div class="status">Cargando productos...</div></section>
</main>
<footer>Pedidos y consultas: WhatsApp 0984 334 677</footer>
<script>
const SUPABASE_URL="https://jdkfitrgaidjudfwjzez.supabase.co";
const SUPABASE_KEY="sb_publishable_w_PZQfVAk4XRIOFyjACRcQ_EYltqUiK";
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
const money=n=>"G. "+Number(n||0).toLocaleString("es-PY");
const wa=n=>"https://wa.me/595984334677?text="+encodeURIComponent("Hola HL&L, quiero consultar por: "+n);
async function cargarProductos(){
  const box=document.getElementById("productos");
  try{
    const url=SUPABASE_URL+"/rest/v1/products?select=*&active=eq.true&order=created_at.desc";
    const r=await fetch(url,{headers:{apikey:SUPABASE_KEY,Authorization:"Bearer "+SUPABASE_KEY}});
    const data=await r.json();
    if(!r.ok) throw new Error(data.message||data.hint||("HTTP "+r.status));
    if(!Array.isArray(data)||data.length===0){box.innerHTML='<div class="status">No hay productos disponibles.</div>';return;}
    box.innerHTML=data.map(p=>{
      const img=p.image_url||"";
      return `<article class="card">${img?`<img src="${esc(img)}" alt="${esc(p.name)}">`:''}<div class="body"><h3>${esc(p.name)}</h3><div class="price">${money(p.price)}</div>${p.capacity?`<div class="meta">Capacidad: ${esc(p.capacity)}</div>`:''}${p.colors?`<div class="meta">Colores: ${esc(p.colors)}</div>`:''}${p.stock!==null&&p.stock!==undefined?`<div class="meta">Stock: ${esc(p.stock)}</div>`:''}<div class="desc">${esc(p.description||"")}</div><a class="wa" href="${wa(p.name)}" target="_blank">Consultar por WhatsApp</a></div></article>`;
    }).join("");
  }catch(e){
    console.error(e);
    box.innerHTML='<div class="status error"><strong>No se pudieron cargar los productos.</strong><br>Detalle: '+esc(e.message||e)+'</div>';
  }
}
cargarProductos();
</script>
</body>
</html>
