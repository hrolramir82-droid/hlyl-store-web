<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HL&L Store — Detalles que marcan</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f5f5;color:#222}
header{background:#111;color:#fff;padding:24px 16px;text-align:center}
header h1{margin:0;font-size:30px}header p{margin:7px 0 0;color:#ddd;font-size:17px}
.wrap{max-width:1100px;margin:auto;padding:18px}.intro{text-align:center;margin-bottom:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(245px,1fr));gap:18px}
.card{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 2px 10px #0001}
.card img{width:100%;height:240px;object-fit:cover;background:#eee}.body{padding:15px}
.body h3{margin:0 0 8px;font-size:19px}.price{font-size:22px;font-weight:bold;margin:8px 0}
.desc{color:#555;font-size:14px;line-height:1.45}.wa{display:block;background:#25D366;color:#fff;text-decoration:none;text-align:center;padding:12px;border-radius:9px;margin-top:14px;font-weight:bold}
footer{text-align:center;background:#111;color:#fff;padding:22px;margin-top:25px}
</style>
</head>
<body>
<header><h1>HL&L Store</h1><p>Detalles que marcan</p></header>
<main class="wrap">
<div class="intro"><h2>Productos personalizados</h2><p>Grabados a láser en termos, Hoppies, vasos y billeteras.</p></div>
<section id="productos" class="grid"></section>
</main>
<footer>Pedidos y consultas: WhatsApp 0984 334 677</footer>
<script>
const productos=[
["Hoppie 1 litro personalizado",80000,"images/hoppie-1l.jpg","Hoppie de 1 litro, práctico y cómodo para acompañarte todos los días. Personalizable con grabado láser."],
["Hoppie 820 ml personalizado",70000,"images/hoppie-820ml.jpg","Hoppie de 820 ml, práctico y versátil para acompañarte durante el día. Personalizable con grabado láser."],
["Hoppie 650 ml personalizado",65000,"images/hoppie-650ml.jpg","Hoppie de 650 ml, práctico y cómodo para acompañarte todos los días. Personalizable con grabado láser."],
["Hoppie 400 ml personalizado",55000,"images/hoppie-400ml.jpg","Hoppie de 400 ml, compacto y práctico, ideal para llevar a cualquier lugar. Personalizable con grabado láser."],
["Termo para tereré 2,5 litros",160000,"images/termo-25l.jpg","Termo de 2,5 litros ideal para tereré, con vaso y bombilla. Personalizable con grabado láser."],
["Termo 1,3 litros personalizado",125000,"images/termo-13l.jpg","Termo de 1,3 litros con vaso, ideal para tereré y uso diario. Personalizable con grabado láser."],
["Termo tipo galón 2 litros",130000,"images/termo-galon-2l.jpg","Termo tipo galón de 2 litros, ideal para tereré y para compartir. Personalizable con grabado láser."],
["Termo para mate 1 litro",100000,"images/termo-mate-1l.jpg","Termo para mate de 1 litro, práctico y cómodo para el uso diario. Personalizable con grabado láser."],
["Billetera personalizada",110000,"images/billetera.jpg","Billetera de diseño elegante y práctico, ideal para regalar. Personalizable con grabado láser."]
];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
const money=n=>"G. "+n.toLocaleString("es-PY");
const wa=n=>"https://wa.me/595984334677?text="+encodeURIComponent("Hola HL&L, quiero consultar por: "+n);
document.getElementById("productos").innerHTML=productos.map(p=>`<article class="card"><img src="${p[2]}" alt="${esc(p[0])}"><div class="body"><h3>${esc(p[0])}</h3><div class="price">${money(p[1])}</div><div class="desc">${esc(p[3])}</div><a class="wa" href="${wa(p[0])}" target="_blank">Consultar por WhatsApp</a></div></article>`).join("");
</script>
</body>
</html>
